name: 自动更新数据

on:
  schedule:
    # 每天北京时间 10:00 抓一次（UTC 02:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取明日方舟（PRTS）
        run: python tools/fetch_arknights.py games.json

      - name: 安装 Playwright（终末地 WIKI 需要渲染）
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 抓取终末地（森空岛 WIKI）
        run: python tools/fetch_endfield.py games.json

      - name: 校验数据
        run: python tools/validate.py games.json

      - name: 有变化就提交
        run: |
          git config user.name "sapphire-widget-bot"
          git config user.email "actions@users.noreply.github.com"
          git add games.json
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "auto: 更新鹰角游戏数据 $(date -u +%Y-%m-%d)"
            git push
          fi
